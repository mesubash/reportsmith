name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Session reader self-check
        run: python tests/test_sessions.py
      - name: Session reader runs on an empty home
        run: HOME="$(mktemp -d)" python skills/reportsmith/scripts/sessions.py --from 2026-01-01 --to 2026-01-31 --include .
      - name: Example config is valid YAML
        run: python -m pip install -q pyyaml && python -c "import yaml; yaml.safe_load(open('skills/reportsmith/config.example.yml'))"
      - name: Manifests are valid JSON
        run: for f in .claude-plugin/*.json; do python -m json.tool "$f" > /dev/null; done
