name: traffic

# GitHub keeps traffic for 14 days. This saves it daily to the `traffic`
# branch (daily.csv, referrers.csv) so the history is kept.
# Needs a TRAFFIC_TOKEN secret: fine-grained token, this repo only,
# repository permission "Administration: read-only".

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
    steps:
      - name: Token missing
        if: env.GH_TOKEN == ''
        run: echo "::notice::TRAFFIC_TOKEN secret is not set; skipping. See the comment at the top of traffic.yml."
      - uses: actions/checkout@v4
        if: env.GH_TOKEN != ''
        with:
          path: main
      - uses: actions/checkout@v4
        if: env.GH_TOKEN != ''
        with:
          ref: traffic
          path: data
      - name: Fetch traffic
        if: env.GH_TOKEN != ''
        run: python3 main/.github/scripts/traffic.py "${{ github.repository }}" data
      - name: Commit
        if: env.GH_TOKEN != ''
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Traffic $(date -u +%F)"
          git push
