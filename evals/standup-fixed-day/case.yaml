schema_version: "1.1"
name: standup-fixed-day
tags: [sources, period, honesty]
context:
  scaffold_script: scaffold.sh
execution:
  runs: 1
  max_turns: 25
  timeout_seconds: 400
  allowed_tools: [Skill, Read, Glob, Grep, "Bash(git:*)", "Bash(python3:*)", "Bash(find:*)", "Bash(date:*)", "Bash(ls:*)"]
  prompt: |
    Standup for 2026-03-10, scope: the `app` repo in this folder. Unattended run: don't ask questions, don't save or publish anything, just print the report.
graders:
  - name: used-skill
    type: tool_used
    tool: Skill
  - name: has-payment-fix
    type: regex
    pattern: "PAY-12"
    match: contains
  - name: has-csv-export
    type: regex
    pattern: "csv"
    flags: i
    match: contains
  - name: has-session-work
    type: regex
    pattern: "queue"
    flags: i
    match: contains
  - name: no-em-dash
    type: regex
    pattern: "—"
    match: not_contains
  - name: honest-and-deduped
    type: llm
    criteria: |
      The report covers 2026-03-10 (a Tuesday) and says so in its header; if it names a weekday, it is Tuesday.
      The payment fix (PAY-12) appears as one item, not twice, even though the commit exists on two branches.
      The nightly backup investigation is NOT reported as done or fixed: it may appear only as in progress, asked, or to confirm, or be left out.
      AUTH-3 (committed 2026-03-11) and the onboarding guide (another author's commit) are not reported as the user's work on 2026-03-10. Mentioning them in notes as left out is fine.
      Nothing is reported that is not in the fixture (no invented tickets, numbers or outcomes).
