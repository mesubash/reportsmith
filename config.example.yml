# reportsmith config — every key is optional.
# Global:   ~/.reportsmith/config.yml
# Per repo: .reportsmith.yml (overrides global, key by key)

prefs:
  timezone: local            # IANA name, e.g. Asia/Kathmandu
  week_starts: monday        # monday | sunday
  language: en

limits:
  max_days: 92               # ask before reporting on a longer range
  max_items: 40              # above this, summarize by week/month instead of listing

scope:                       # which work counts; default = current repo
  include: [.]               # e.g. [~/Developer/work]
  exclude: []

sources:
  git:
    repos: auto              # auto = every repo under scope; or list paths/globs
    author: auto             # auto = `git config user.email`
  sessions: auto             # agent session logs under scope (Claude Code, Codex)
  memory: auto               # memory MCP such as claude-mem, if connected

reports:
  standup:
    audience: team           # manager | team | public | self
    format: slack            # markdown | slack | email | plain
    length: short            # short | medium | long
  weekly:
    audience: manager
    format: markdown
    length: medium
  changelog:
    audience: public
    style: keep-a-changelog  # keep-a-changelog | prose

output:
  dir: ~/.reportsmith/out    # <kind>-<period>.md is written here
